[package]
name = "emucontainer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Build and run self-contained emulator and ROM images"
repository = "https://github.com/Dorely/EmuContainer"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.3"
zip = { version = "8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
junction = { version = "2.0.0", default-features = false }
win32job = "2.0.3"
winreg = "0.56.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
