[package]
name = "emucontainer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Build native, self-contained packages for emulated games"
repository = "https://github.com/Dorely/EmuContainer"
publish = false

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
